<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> you hi</h1>
    <button id='stop'>Stop</button>
</body>
<script>
    setTimeout(function(){
        console.log("async");
    },2000)// time in ms

    //setInterval(function(){
        console.log('async');

    const sayAsync = function(){
        console.log('async');
    }
    setTimeout(sayAsync,2000)// reference

    const changeText = function(){document.querySelector('h1').innerHTML = 'javascript'}
    const change = setTimeout(changeText,2000)

   
    // what if we want to stop this change from happening
    document.querySelector('#stop').addEventListener('click', function(){
        clearTimeout(change)
        console.log("stopped")

    })


    
    
</script>

</html>
